name: build-rotateprobe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          echo "SDK_VERSION = $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compile dylibs
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out

          for NAME in RotateProbe RotateFix; do
            echo "===== building $NAME ====="
            xcrun --sdk iphoneos clang \
              -dynamiclib \
              -arch arm64 \
              -isysroot "$SDK" \
              -miphoneos-version-min=15.0 \
              -fobjc-arc \
              -O2 \
              -Wall \
              -Wno-deprecated-declarations \
              -Wno-unused-function \
              -framework UIKit \
              -framework Foundation \
              -framework CoreGraphics \
              -framework AVFoundation \
              -install_name "@rpath/$NAME.dylib" \
              -o "out/$NAME.dylib" \
              "src/$NAME.m"
          done

      - name: Ad-hoc sign and verify
        run: |
          set -euo pipefail
          for F in out/*.dylib; do
            codesign --force --sign - --timestamp=none "$F"
            echo "--- $F ---"
            lipo -info "$F"
            otool -L "$F"
          done
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotate-dylibs
          path: out/*.dylib
          if-no-files-found: error
